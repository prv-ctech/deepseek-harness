# Reference deployment behind Pangolin (or any reverse proxy that reaches the
# host by IP:port). `newt` publishes the site to
# http://<host-ip>:3080, so the port must be reachable on a non-loopback
# interface — a 127.0.0.1 publish is invisible to it.
services:
  deepseek-harness:
    # Override DSH_IMAGE to change variant or pin a version — e.g.
    # DSH_IMAGE=ghcr.io/prv-ctech/deepseek-harness-plus:latest for the -plus
    # image, which adds a real Chrome (for plugins like dsh-realbrowser),
    # python/pip, rtk, the codebase-memory-mcp binary and the Android
    # reverse-engineering toolchain. Nothing else changes: ports, caps and
    # hardening are the same for both variants.
    image: ${DSH_IMAGE:-ghcr.io/prv-ctech/deepseek-harness:latest}
    container_name: deepseek-harness
    restart: unless-stopped
    # DSH_PUBLIC_HOST must be the authority the browser uses; it is passed to
    # dsh as --trusted-host, which is what the /api trust fence checks. A
    # mismatch shows up as HTTP 403 on every API call.
    #
    # Deliberately required rather than defaulted: a baked-in default would make
    # every deployment trust one operator's domain. Put yours in `.env` (compose
    # reads it automatically; it is gitignored) — see `.env.example`.
    environment:
      DSH_PUBLIC_HOST: ${DSH_PUBLIC_HOST:?set DSH_PUBLIC_HOST in .env to the authority browsers use, e.g. dsh.example.com}
      # Extra authorities accepted by the fence, comma-separated (e.g. the LAN
      # address you use to reach this box without going through the proxy).
      DSH_TRUSTED_HOSTS: ${DSH_TRUSTED_HOSTS:-}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      # Sandbox stays on. Hosts where the kernel cannot enforce it are the
      # exception, not the rule: the Landlock rung is unprivileged and works in
      # a default and a hardened container alike, and when no rung works dsh
      # fails closed instead of silently running unsandboxed. Set this to
      # danger-full-access only if you accept unsandboxed execution.
      DSH_PERMISSION_MODE: ${DSH_PERMISSION_MODE:-workspace-write}
      # Plus-only; no Chrome autolaunch, viewer port publication or DSH embedding.
      # Create an owned 0600 password file before opting in; see docs/selkies.md.
      DSH_GRAPHICS_ENABLED: ${DSH_GRAPHICS_ENABLED:-false}
      DSH_GRAPHICS_DISPLAY: ${DSH_GRAPHICS_DISPLAY:-:99}
      DSH_GRAPHICS_RESOLUTION: ${DSH_GRAPHICS_RESOLUTION:-1280x720}
      DSH_GRAPHICS_MAX_RESOLUTION: ${DSH_GRAPHICS_MAX_RESOLUTION:-3840x2160}
      DSH_GRAPHICS_PORT: ${DSH_GRAPHICS_PORT:-8080}
      DSH_GRAPHICS_PASSWORD_FILE: ${DSH_GRAPHICS_PASSWORD_FILE:-/home/node/.dsh/graphics-password}
    ports:
      # Host side defaults to all interfaces so newt/Pangolin can reach it.
      # Narrow it to a specific LAN address, e.g. 192.168.1.10:3080:3080.
      - "${DSH_BIND:-0.0.0.0}:${DSH_PORT:-3080}:3080"
    volumes:
      - dsh-state:/home/node/.dsh
      # The agent's sandbox root is process.cwd(); mount the work you want it to
      # see here. Ownership is handled by the entrypoint (PUID/PGID above).
      - ${DSH_WORKSPACE:-./workspace}:/workspace
    # Hardening that is verified to work with this image. `--read-only` is safe
    # because every writable path lives in the state volume or /tmp; /tmp must
    # stay exec-capable unless NARB_NATIVE_CACHE_DIR points at a real
    # filesystem, which the image already does.
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=${DSH_TMP_SIZE:-256m}
    # Existing Docker default is 64m. Graphics testing recommends 256m; no GPU.
    shm_size: ${DSH_SHM_SIZE:-64m}
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    # The entrypoint starts as root only to take ownership of the mounted
    # volumes, so it needs exactly these five; everything else is dropped.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    pids_limit: ${DSH_PIDS_LIMIT:-512}

volumes:
  dsh-state:
