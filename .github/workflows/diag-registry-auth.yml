name: diag registry auth

# Diagnostic only, deleted after the result is known: the `plan` job reads a
# published image's recipe label over the registry API. If that read fails
# against a PRIVATE package, every run treats every tag as missing and rebuilds
# all of them every six hours. This exercises the exact read path.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push a probe image carrying the recipe label
        run: |
          mkdir -p /tmp/ctx
          printf 'FROM busybox:latest\nLABEL org.opencontainers.image.dsh-recipe=deadbeef1234\n' > /tmp/ctx/Dockerfile
          docker build -t ghcr.io/prv-ctech/dsh-ci-probe:reciptest /tmp/ctx
          docker push ghcr.io/prv-ctech/dsh-ci-probe:reciptest

      - name: "Read it back exactly as the plan job does"
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          got=$(./scripts/published-recipe.sh ghcr.io prv-ctech/dsh-ci-probe reciptest "$TOKEN")
          rc=$?
          echo "read exit=$rc label='$got'"
          if [ "$rc" = 0 ] && [ "$got" = "deadbeef1234" ]; then
            echo "RESULT: private-package label read WORKS"
          else
            echo "RESULT: label read BROKEN (plan would rebuild every run)"
          fi

          ./scripts/published-recipe.sh ghcr.io prv-ctech/dsh-ci-probe no-such-tag-xyz "$TOKEN" >/dev/null 2>&1
          echo "RESULT: missing tag exit=$? (1 = correctly reported missing)"

      - name: Clean up the probe tag
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            'https://api.github.com/user/packages/container/dsh-ci-probe/versions' \
            | jq -r '.[] | select(.metadata.container.tags[]? == "reciptest") | .id' | head -1)
          [ -n "$id" ] && curl -fsSL -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/user/packages/container/dsh-ci-probe/versions/$id" || true
          echo "cleanup done"
