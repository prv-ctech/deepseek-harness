name: build

# Tracks upstream release candidates for @deepseek-ai/dsh.
#
# The registry's `latest` dist-tag is NOT a reliable pointer to the newest code:
# 0.1.7-rc.2 was published while `latest` still resolved to 0.1.5-rc.3. So the
# version list is read from the registry and filtered by version, never by tag.
#
# Every run is idempotent: a version whose image already carries this recipe's
# hash is skipped, which means a plain schedule run costs nothing and a recipe
# change rebuilds the already-published tags.

on:
  schedule:
    # 0.1.7-rc.2 was published at 14:18 UTC; a 6-hourly sweep puts a new RC
    # within a working day without hammering the registry.
    - cron: '23 */6 * * *'
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker-entrypoint.sh
      - proxy.patch.yml
      - fix/**
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version to build (default: every tracked version missing an image)'
        required: false
        type: string
      rebuild:
        description: 'Rebuild even when the image already carries this recipe'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # Same recipe, one build arg apart: this package ships the base image plus
  # system Chrome, for plugins that drive a real browser over CDP.
  IMAGE_CHROME: ghcr.io/${{ github.repository }}-chrome
  # The -chrome package plus Python/pip, the rtk binary and an Android
  # decompilation toolchain. INSTALL_PLUS implies INSTALL_CHROME in the
  # Dockerfile, so this leg sets the plus arg alone and still gets Chrome.
  IMAGE_PLUS: ghcr.io/${{ github.repository }}-plus
  REGISTRY: ghcr.io
  # Lowest release this repo publishes; anything older is out of scope.
  MIN_VERSION: '0.1.7-rc.2'
  BASE_IMAGE: node:22-bookworm-slim

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_work: ${{ steps.plan.outputs.has_work }}
      newest: ${{ steps.plan.outputs.newest }}
    steps:
      - uses: actions/checkout@v4

      # Three hashes, one per package. The base hash is the plain digest of the
      # recipe files, so this change alone does not renumber the package that is
      # already published; the Chrome and plus variants each mix their own name
      # in, so no two packages can skip each other's rebuild.
      - name: Compute recipe hash
        id: recipe
        run: |
          files='Dockerfile docker-entrypoint.sh proxy.patch.yml fix/owns-host.mjs'
          # shellcheck disable=SC2086
          echo "base=$(cat $files | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
          echo "chrome=$( { cat $files; echo chrome; } | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
          echo "plus=$( { cat $files; echo plus; } | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Plan versions to build
        id: plan
        env:
          REQUESTED: ${{ inputs.version }}
          REBUILD: ${{ inputs.rebuild }}
          RECIPE_BASE: ${{ steps.recipe.outputs.base }}
          RECIPE_CHROME: ${{ steps.recipe.outputs.chrome }}
          RECIPE_PLUS: ${{ steps.recipe.outputs.plus }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Published versions, oldest first. `sort -V` orders
          # 0.1.7-rc.2 < 0.1.7-rc.10 correctly, which a string compare does not.
          all=$(curl -fsSL https://registry.npmjs.org/@deepseek-ai/dsh \
            | jq -r '.versions | keys[]' | sort -V)
          at_least() { [ "$(printf '%s\n%s\n' "$2" "$1" | sort -V | head -1)" = "$2" ]; }
          candidates=$(printf '%s\n' "$all" | grep -E -- '-rc\.[0-9]+$' | while read -r v; do
            at_least "$v" "$MIN_VERSION" && echo "$v"
          done)

          if [ -n "${REQUESTED:-}" ]; then
            printf '%s\n' "$candidates" | grep -qx "$REQUESTED" \
              || { echo "::error::$REQUESTED is not tracked (rc only, >= $MIN_VERSION)"; exit 1; }
            candidates="$REQUESTED"
          fi
          [ -n "$candidates" ] || { echo "::error::no candidate versions found"; exit 1; }

          # Rebuild when the tag is absent, or when the image carries a different
          # recipe hash. The label is the source of truth, so a Dockerfile fix
          # reaches versions that were already published.
          #
          # All three packages are planned from the same version list, one
          # matrix entry each, so a version cannot end up published for one and
          # missing for the others.
          entries="[]"
          for variant in base chrome plus; do
            chrome=false
            plus=false
            case "$variant" in
              base)   repository="$IMAGE"; recipe="$RECIPE_BASE" ;;
              chrome) repository="$IMAGE_CHROME"; recipe="$RECIPE_CHROME"; chrome=true ;;
              # INSTALL_CHROME stays false on the plus leg: the Dockerfile
              # derives Chrome from INSTALL_PLUS, so the two are never both
              # set. Each arg is passed from its own matrix field, because a
              # leg that relied on the default would build the base image.
              plus)   repository="$IMAGE_PLUS"; recipe="$RECIPE_PLUS"; plus=true ;;
            esac
            for v in $candidates; do
              reason=""
              if ! published=$(./scripts/published-recipe.sh "$REGISTRY" "$repository" "$v" "$TOKEN" 2>/dev/null); then
                reason="missing"
              elif [ "$published" != "$recipe" ]; then
                reason="recipe-changed"
              fi
              if [ -n "$reason" ] && [ "${REBUILD:-false}" = "true" ]; then
                reason="requested"
              fi
              if [ -n "$reason" ]; then
                echo "$repository:$v -> build ($reason)"
                entries=$(printf '%s' "$entries" | jq -c \
                  --arg v "$v" --arg r "$recipe" --arg repo "$repository" \
                  --argjson chrome "$chrome" --argjson plus "$plus" \
                  '. + [{version:$v, recipe:$r, repository:$repo, chrome:$chrome, plus:$plus}]')
              else
                echo "$repository:$v -> up to date"
              fi
            done
          done

          if [ "$entries" = "[]" ]; then
            echo "has_work=false" >> "$GITHUB_OUTPUT"
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
          else
            echo "has_work=true" >> "$GITHUB_OUTPUT"
            echo "matrix={\"include\":$entries}" >> "$GITHUB_OUTPUT"
          fi

          # :latest follows the newest tracked version, computed here because
          # the matrix only lists versions that needed building.
          echo "newest=$(printf '%s\n' $candidates | sort -V | tail -1)" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      # amd64 only. GHCR is not behind Cloudflare, so the chunked-push workaround
      # a Cloudflare-fronted registry needs is unnecessary here, and arm64 would
      # mean emulated builds for a target nobody has asked for.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The push can be refused once with `denied: permission_denied:
      # write_package` when this job races a sibling matrix leg that is creating
      # the same brand-new package — that is how the chrome package's first
      # publication lost one tag while the sibling pushed the same name 40s
      # later. Losing that race is not a build failure, so the push is retried
      # with identical inputs; the job still fails if the retry fails too.
      - id: push
        name: Build and push ${{ matrix.repository }}:${{ matrix.version }}
        uses: docker/build-push-action@v6
        continue-on-error: true
        with: &build-push
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ matrix.repository }}:${{ matrix.version }}
          build-args: |
            DSH_VERSION=${{ matrix.version }}
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            INSTALL_CHROME=${{ matrix.chrome }}
            INSTALL_PLUS=${{ matrix.plus }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.dsh-recipe=${{ matrix.recipe }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # `outcome`, not `conclusion`: it is the result before continue-on-error,
      # which is the only place the first attempt's failure is still visible.
      # Layers are in the gha cache by now, so this costs a push, not a build.
      - name: Retry push ${{ matrix.repository }}:${{ matrix.version }}
        if: steps.push.outcome == 'failure'
        uses: docker/build-push-action@v6
        with: *build-push

      # Smoke test the pushed image in the posture the README documents: a
      # published port, a state volume, and the launch-token gate answering.
      # The Chrome variant adds the checks that decide whether a browser can
      # start at all, then a real launch under the hardened runtime; the plus
      # variant adds Python, rtk and an APK decompiled to Java source.
      - name: Smoke test ${{ matrix.repository }}:${{ matrix.version }}
        env:
          VERSION: ${{ matrix.version }}
          IMAGE_TAG: ${{ matrix.repository }}:${{ matrix.version }}
          CHROME: ${{ matrix.chrome }}
          PLUS: ${{ matrix.plus }}
          # jadx's own 9.8 kB test APK, from the pinned release tag. Small on
          # purpose: the point is that a real APK comes out as Java source, not
          # that a large one does.
          APK_URL: https://raw.githubusercontent.com/skylot/jadx/v1.5.6/jadx-cli/src/test/resources/samples/small.apk
        run: |
          set -euo pipefail
          name="smoke-${VERSION//[^a-zA-Z0-9]/-}"
          hardened="${name}-chrome"
          cleanup() { docker rm -f "$name" "$hardened" >/dev/null 2>&1 || true
                      docker volume rm "${name}-state" "${hardened}-state" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          # INSTALL_PLUS implies Chrome in the Dockerfile, so the browser checks
          # are selected by either arg rather than by CHROME alone.
          browser=false
          if [ "$CHROME" = "true" ] || [ "$PLUS" = "true" ]; then browser=true; fi

          docker run -d --name "$name" -p 127.0.0.1:3080:3080 \
            -v "${name}-state:/home/node/.dsh" "$IMAGE_TAG"

          for _ in $(seq 1 40); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' "$name" 2>/dev/null)" = "healthy" ] && break
            sleep 3
          done
          docker inspect --format '{{.State.Health.Status}}' "$name" | grep -q healthy

          test "$(docker exec "$name" dsh --version)" = "$VERSION"

          # tini stays PID 1 (uid 0) while dsh itself runs as the unprivileged
          # numeric PUID — the whole point of the entrypoint. The runtime
          # process is located by its command line; it is exec'd through
          # /usr/local/bin/dsh, so node's own script path is not visible here.
          # Its own pid is skipped, because this shell's command line contains
          # the pattern being searched for and would otherwise match itself.
          test "$(docker exec "$name" awk '/^Uid:/{print $2}' /proc/1/status)" = "0"
          dsh_uid=$(docker exec "$name" sh -c 'me=$$; for p in /proc/[0-9]*; do
              pid=${p#/proc/}; [ "$pid" = "$me" ] && continue
              c=$(head -c 200 "$p/cmdline" 2>/dev/null | tr "\0" " ")
              case "$c" in *"dsh web"*) awk "/^Uid:/{print \$2}" "$p/status"; break;; esac
            done')
          echo "dsh uid: $dsh_uid"
          [ "$dsh_uid" = "1000" ]

          # 401 = launch-token gate (0.1.7 behaviour); 303 = token exchange.
          code=$(docker run --rm --network "container:$name" curlimages/curl \
            -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3080/)
          echo "index status: $code"
          printf '%s' "$code" | grep -qE '^(200|303|401)$'

          # --- Chrome variant -------------------------------------------------
          # A browser is only shippable from here if it starts under the
          # hardened runtime, so these run in order: the three checks that
          # decide whether Chrome can start at all, then a real launch in the
          # documented posture, with the flags the plugin passes. Selected by
          # $browser, not $CHROME: the plus leg installs Chrome too, and the
          # else branch below asserts Chrome is ABSENT, so testing $CHROME here
          # would send the plus image into the base package's checks.
          if [ "$browser" = "true" ]; then
            chrome_version=$(docker exec "$name" google-chrome-stable --version)
            echo "chrome: $chrome_version"
            printf '%s' "$chrome_version" | grep -qi 'Google Chrome'
            # One missing shared library is an immediate abort, and the message
            # names the library, never the package that should have shipped it.
            test -z "$(docker exec "$name" sh -c 'ldd /opt/google/chrome/chrome | grep "not found" || true')"
            # Without fontconfig, Chrome dies on font loading with
            # "FATAL: SkFontMgr_FontConfigInterface.cpp Not implemented" and
            # signal 6 — which reaches the plugin as a closed CDP websocket.
            docker exec "$name" test -f /etc/fonts/fonts.conf
            # ...and the fonts themselves, by coverage rather than by path: a
            # missing Japanese or Arabic family draws tofu, it does not error,
            # so nothing else here would notice. fc-list filters on what the
            # installed fonts actually cover, which makes an empty result the
            # failure — one query per font package, so dropping any of them
            # fails the build.
            docker exec "$name" sh -c 'test -n "$(fc-list :lang=ja)"'      # fonts-noto-cjk
            docker exec "$name" sh -c 'test -n "$(fc-list :lang=ar)"'      # fonts-noto-core
            docker exec "$name" sh -c 'test -n "$(fc-list :charset=1f600)"' # fonts-noto-color-emoji

            # compose.yaml's posture, including the five capabilities the
            # entrypoint's chown/setpriv path needs; everything else is dropped.
            # Boots dsh too, so it also proves that path survives --read-only.
            # noexec /tmp is safe: Chrome never execs from there.
            docker run -d --name "$hardened" \
              --read-only --cap-drop ALL --security-opt no-new-privileges:true \
              --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER \
              --cap-add SETGID --cap-add SETUID \
              --tmpfs /tmp:rw,nosuid,nodev,noexec,size=256m \
              -v "${hardened}-state:/home/node/.dsh" "$IMAGE_TAG"
            for _ in $(seq 1 40); do
              [ "$(docker inspect --format '{{.State.Health.Status}}' "$hardened" 2>/dev/null)" = "healthy" ] && break
              sleep 3
            done
            docker inspect --format '{{.State.Health.Status}}' "$hardened" | grep -q healthy

            # The volume holds no browser, so the resolver the plugin uses can
            # only be finding the image's own /usr/bin/google-chrome-stable.
            docker exec "$hardened" test ! -e /home/node/.dsh/realbrowser/browser
            docker exec -u 1000:1000 "$hardened" mkdir -p /home/node/.dsh/realbrowser

            # Exactly the plugin's flags. Runs as the runtime uid, like dsh
            # would: a browser that only works as root is not usable here. No
            # LD_LIBRARY_PATH and no FONTCONFIG_FILE are set anywhere.
            docker exec -u 1000:1000 -d "$hardened" sh -c "google-chrome-stable \
              --headless --no-sandbox --disable-dev-shm-usage --no-first-run \
              --no-default-browser-check --remote-debugging-port=9222 \
              --user-data-dir=/home/node/.dsh/realbrowser/browser \
              'data:text/html,<form><input name=q></form>' \
              > /home/node/.dsh/chrome.log 2>&1"

            # CDP is the plugin's transport, and /json/list holds the page
            # target — which only exists once the renderer has committed the
            # form page, the font path that aborts on a missing fontconfig.
            # Polled, then asserted once more, so a timeout fails with the real
            # command instead of a bare loop exit.
            cdp() { docker exec "$hardened" node -e \
              "fetch('http://127.0.0.1:9222/$1').then(r=>r.json()).then(v=>process.exit($2)).catch(()=>process.exit(1))"; }
            cdp_until() { for _ in $(seq 1 20); do cdp "$1" "$2" && return 0; sleep 1; done; cdp "$1" "$2"; }
            cdp_until json/version '/Chrome\//.test(v.Browser)?0:1'
            cdp_until json/list 'v.some(t=>/^data:text\/html/.test(t.url))?0:1'
            if docker exec "$hardened" grep -qE 'signal 6|FATAL' /home/node/.dsh/chrome.log; then
              docker exec "$hardened" cat /home/node/.dsh/chrome.log
              echo "::error::Chrome aborted under the hardened runtime"
              exit 1
            fi

            # ...and the plus toolchain under the same posture, as the runtime
            # uid. A JVM start and a Python import both need a writable /tmp
            # and a writable HOME, which is precisely what this posture
            # narrows; if either failed here the tool would be useless in the
            # deployment the README documents.
            if [ "$PLUS" = "true" ]; then
              docker exec -u 1000:1000 "$hardened" jadx --version
              docker exec -u 1000:1000 "$hardened" rtk --version
              docker exec -u 1000:1000 "$hardened" python3 -c 'import androguard'
              # Proves the PEP 668 override reaches the runtime, not just the
              # build: pip 23.0.1 runs its externally-managed check on
              # `--dry-run` (only --root/--target/--prefix and --dry-run with
              # --report skip it), so this aborts if the env var went missing.
              # `idna` is already installed, so it resolves offline.
              docker exec -u 1000:1000 "$hardened" \
                python3 -m pip install --dry-run --no-cache-dir idna
            fi
          else
            # The base package is the one that promises no browser stack, so a
            # stray Chrome would change its size and its attack surface unseen.
            # Written as a positive `test`, not `! command -v`: that would also
            # pass when the exec itself failed.
            docker exec "$name" test ! -e /usr/bin/google-chrome-stable
            docker exec "$name" test ! -d /opt/google/chrome
          fi

          # --- plus variant ---------------------------------------------------
          # Every tool is asserted by running it or by resolving it on PATH,
          # never by its file merely existing. The Debian android packages
          # install into /usr/lib/android-sdk/build-tools/debian/, so a missing
          # PATH entry is exactly the failure mode this image has to rule out,
          # and it is invisible to a file-existence check.
          if [ "$PLUS" = "true" ]; then
            docker exec "$name" python3 --version
            docker exec "$name" python3 -m pip --version
            # An import, not a pip list line: it is the strongest cheap proof
            # that the preinstalled analysis stack is actually importable.
            docker exec "$name" python3 -c 'import androguard; print(androguard.__version__)'

            # rtk's plugin contract, as measured on 0.50.0: a rewritable
            # command exits 3 with the rewritten command on stdout, while a
            # command rtk has no equivalent for exits 1 and prints nothing. The
            # plugin keys off exactly that, and its own --help says "exits 0",
            # so the code is asserted rather than assumed.
            docker exec "$name" sh -c 'out=$(rtk rewrite "cat /etc/hostname"); rc=$?
              test "$rc" = 3 || { echo "rtk rewrite exit: $rc"; exit 1; }
              echo "$out"' | grep -qx 'rtk read /etc/hostname'
            docker exec "$name" sh -c 'rtk rewrite "echo x" >/dev/null; test $? = 1'

            for tool in jadx apktool aapt aapt2 dexdump apksigner zipalign \
                        smali baksmali enjarify; do
              docker exec "$name" sh -c "command -v $tool >/dev/null" \
                || { echo "::error::$tool is not on PATH in the plus image"; exit 1; }
            done
            docker exec "$name" jadx --version
            docker exec "$name" apktool --version

            # The reason the image exists: a real APK in, readable source out.
            # jadx for Java, apktool for the smali/resource tree that can be
            # rebuilt. Both run over the same fixture, fetched once.
            docker exec "$name" sh -c "curl -fsSL -o /tmp/small.apk '$APK_URL'"

            # apktool cannot resolve a single resource without its framework,
            # and the image redirects XDG_DATA_HOME into the state volume, so
            # the entrypoint links the framework there. This asserts the link
            # rather than trusting it.
            docker exec "$name" test -L /home/node/.dsh/share/apktool/framework/1.apk

            docker exec "$name" sh -c 'jadx -d /tmp/jadxout /tmp/small.apk >/dev/null
              && grep -q "class MainActivity" \
                 /tmp/jadxout/sources/io/github/skylot/android/smallapp/MainActivity.java'
            docker exec "$name" sh -c 'apktool d -f -o /tmp/apktool-out /tmp/small.apk >/dev/null
              && test -f /tmp/apktool-out/AndroidManifest.xml
              && test -f /tmp/apktool-out/apktool.yml
              && grep -q "MainActivity" \
                 /tmp/apktool-out/smali/io/github/skylot/android/smallapp/MainActivity.smali'
          fi

          # The base and -chrome packages promise none of the -plus payload, so
          # a layer that leaked it would change their size and their attack
          # surface unseen. Same positive-`test` rule as the browser check above.
          if [ "$PLUS" != "true" ]; then
            docker exec "$name" test ! -e /usr/local/bin/rtk
            docker exec "$name" test ! -e /opt/jadx
            docker exec "$name" test ! -e /usr/bin/apktool
            docker exec "$name" test ! -e /usr/bin/smali
            docker exec "$name" sh -c '! command -v python3'
            docker exec "$name" test ! -e /usr/share/android-framework-res
          fi

  latest:
    needs: [plan, build]
    if: needs.plan.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # Move :latest by copying a manifest, so it always resolves to a digest
      # that already passed the smoke test above. The target is the newest
      # tracked version, which exists by now either because this run built it or
      # because it was already up to date — the matrix alone would be wrong,
      # since it lists only what needed building.
      #
      # All three packages, one line each: they are published in lockstep, so
      # leaving a variant behind would pin it to a version the base moved off.
      - name: Retag :latest
        env:
          NEWEST: ${{ needs.plan.outputs.newest }}
        run: |
          set -euo pipefail
          for repository in "$IMAGE" "$IMAGE_CHROME" "$IMAGE_PLUS"; do
            echo "$repository:latest -> $NEWEST"
            docker buildx imagetools create -t "$repository:latest" "$repository:$NEWEST"
          done
