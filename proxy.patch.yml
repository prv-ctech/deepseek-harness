# Launcher patch layer for containerized `dsh web` (passed via --patch).
#
# This file carries the plugin below, not the listener. There is no `webserver`
# row here, and that is deliberate: the webserver schema accepts one concrete
# interface address and rejects `0.0.0.0` outright, because an all-interfaces
# listener exposes remote code execution on every interface the operator did
# not mean to publish. The bind therefore comes from upstream's own `--host`
# flag, which the entrypoint sets to the address the container actually has
# (bin/dsh-bind-host). A patch cannot carry it either way: a layer REPLACES the
# whole config of the row it names and `host` has no default, so restating only
# `port` fails with `$.host missing required value` — verified against
# 0.2.1-rc.2. Nothing is lost: the composed row already defaults port 3080 and
# gzip compression.
#
# `trustedHosts` and `publicUrl` are deliberately NOT patched either. Both
# travel through upstream's own flags, `--trusted-host` and `--public-url`,
# which the entrypoint derives from $DSH_PUBLIC_HOST and the web-app bundle
# feeds into the `connection` and `web-app` rows. The `/api` fence also accepts
# the listener's own bind address, so with host networking — where the bind
# address *is* the host's LAN address — browsing by IP needs no naming. Under
# bridge networking the address a browser uses is the Docker host's, not the
# container's, so that authority belongs in $DSH_TRUSTED_HOSTS.
#
# The plugin keeps the remote Settings UI writable. Absolute path: the loader
# rewrites it to `file:///…` beside this patch, so the image needs no package
# manager to compose it.
- insert:
    - id: pangolin-owns-host
      name: /opt/deepseek-harness/fix/owns-host.mjs
